[package]
name = "ocpp-kit"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Open Charge Point Protocol (OCPP 1.6J, 2.0.1, 2.1) toolkit for Rust: typed messages, OCPP-J framing, a sans-I/O protocol engine, and transports for charging stations, CSMS and local controllers. Placeholder release — name reserved, implementation in progress."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/ocpp-kit"
homepage = "https://github.com/hupe1980/ocpp-kit"
readme = "README.md"
keywords = ["ocpp", "ev-charging", "emobility", "charging-station", "csms"]
categories = ["network-programming", "api-bindings", "embedded"]
exclude = ["specs/", "schemas/", "CONCEPT.md", ".github/"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
