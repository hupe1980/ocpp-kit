name: Release

# Publishes to crates.io and creates a GitHub release when a `v*` tag is pushed.
# Requires crates.io Trusted Publishing to be configured for this repository/workflow
# (crates.io → ocpp-kit → Settings → Trusted Publishing → GitHub: hupe1980/ocpp-kit, release.yml).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo publish --dry-run

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC token for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          name: ocpp-kit ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
